{% include "header.html" %}
{% load crispy_forms_tags %}


<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">My Profile</h4>
        </div>
        <div class="card-body p-4 bg-white">
          <div class="row">
            <div class="col-md-4 text-center">
              {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}" class="profile-img mb-3" alt="Profile Picture">
              {% else %}
                <img src="https://via.placeholder.com/160" class="profile-img mb-3" alt="No Picture">
              {% endif %}
              <h5 class="fw-bold">{{ user.first_name }} {{ user.last_name }}</h5>
              <p class="text-muted">{{ user.get_user_type_display }}</p>
            </div>
            <div class="col-md-8">
              <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary mt-3">save</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr>
<p class="text-end mt-2">
  <a href="{% url 'password_change' %}" class="btn btn-outline-secondary btn-sm">Change Password</a>
</p>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.querySelector('#id_profile_picture');
  const previewImg = document.querySelector('.profile-img');

  if (fileInput && previewImg) {
    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result; // update preview instantly
        };
        reader.readAsDataURL(file);
      }
    });
  }
});
</script>

</body>
</html>
